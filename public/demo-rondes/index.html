<title>Démonstration - Edgward</title>

<style>
:root{--fond:#111414;--bloc:#222729;--trait:#343a3c;--t1:#fff;--t3:#8d9496;--bleu:#3d8ff5;--rouge:#f2b8b3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fond);color:var(--t1);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
form{width:100%;max-width:360px;background:var(--bloc);border:1px solid var(--trait);border-radius:20px;padding:28px 24px}
h1{margin:0 0 6px;font-size:24px;font-weight:600}
p{margin:0 0 20px;color:var(--t3);font-size:15px}
label{display:block;font-size:13px;color:var(--t3);margin-bottom:6px}
input{width:100%;height:50px;border-radius:12px;border:1px solid var(--trait);background:var(--fond);color:var(--t1);font-size:17px;padding:0 14px;outline:none}
input:focus{border-color:var(--bleu)}
button{margin-top:14px;width:100%;height:50px;border:0;border-radius:25px;background:var(--bleu);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
button[disabled]{opacity:.6;cursor:default}
.err{min-height:20px;margin-top:10px;color:var(--rouge);font-size:14px}
</style>
</head>
<body>
<main>
<form id="f" autocomplete="off">

<p>Rondes planifiées - accès réservé. Saisissez le code qui vous a été communiqué.</p>
<label for="c">Code d'accès</label>
<input id="c" type="password" required autofocus>
<button id="b" type="submit">Ouvrir la démonstration</button>
<div class="err" id="e" role="alert"></div>
</form>
</main>
