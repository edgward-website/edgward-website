name: Carte sécurité — collecte 2x/jour

# Midi et soir (heure suisse ≈ 12h / 19h ; UTC ne gère pas l'heure d'été,
# léger décalage d'1h possible selon la saison — sans conséquence).
on:
  schedule:
    - cron: "0 10 * * *"   # ~12h00 (CEST) / 11h00 (CET)
    - cron: "0 17 * * *"   # ~19h00 (CEST) / 18h00 (CET)
  workflow_dispatch:        # bouton « Run » manuel dans l'onglet Actions

# Le robot met à jour la carte tout seul : il écrit sur main, puis construit
# et déploie le site dans la foulée (un push par le jeton interne ne relance
# pas le déploiement standard, d'où le build/deploy intégrés ici).
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collecte + tri IA
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/carte-securite/collecte.mjs

      - name: Publier sur main (si changement)
        id: publish
        run: |
          if git diff --quiet -- src/data/evenements-securite.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucun changement depuis la dernière mise à jour."
            exit 0
          fi
          git config user.name "Robot Carte Edgward"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/evenements-securite.json
          git commit -m "Carte sécurité — mise à jour automatique"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Construire le site
        if: steps.publish.outputs.changed == 'true'
        uses: withastro/action@v3
        with:
          node-version: 22

      - name: Déployer sur GitHub Pages
        id: deployment
        if: steps.publish.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
