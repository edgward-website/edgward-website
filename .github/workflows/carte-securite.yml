name: Carte sécurité — collecte 2x/jour

# Midi et soir (heure suisse ≈ 12h / 19h ; UTC ne gère pas l'heure d'été,
# léger décalage d'1h possible selon la saison — sans conséquence).
on:
  schedule:
    - cron: "0 10 * * *"   # ~12h00 (CEST) / 11h00 (CET)
    - cron: "0 17 * * *"   # ~19h00 (CEST) / 18h00 (CET)
  workflow_dispatch:        # bouton « Run » manuel dans l'onglet Actions

# Le robot n'a besoin que d'écrire une branche (pas de création de PR côté
# Actions, interdite par l'organisation). C'est toi qui ouvres/fusionnes la PR.
permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collecte + tri IA
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/carte-securite/collecte.mjs

      - name: Résumé lisible (page du run)
        if: always()
        run: cat scripts/carte-securite/resume-pr.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Déposer la proposition sur une branche
        run: |
          if git diff --quiet -- src/data/evenements-securite.json; then
            echo "Aucun changement depuis la dernière publication — rien à proposer."
            exit 0
          fi
          git config user.name "Robot Carte Edgward"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B maj-carte-securite
          git add src/data/evenements-securite.json
          git commit -m "Carte sécurité — mise à jour automatique"
          git push --force origin maj-carte-securite
          echo "Branche 'maj-carte-securite' prête. Ouvre la PR : https://github.com/edgward-website/edgward-website/compare/main...maj-carte-securite?expand=1"
